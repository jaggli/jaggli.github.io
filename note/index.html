<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>note — minimal text editor</title>
    <meta name="description" content="A minimal, local-first text editor in the browser. No signup, no cloud — your notes stay in your browser.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23181825'/><text x='16' y='23' text-anchor='middle' font-family='system-ui' font-weight='400' font-size='20' fill='white'>N</text></svg>">
    <style>
        @font-face {
            font-family: 'Victor Mono';
            src: url('victor-mono/VictorMono-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1e1e2e;
            --sidebar: #181825;
            --surface: #1e1e2e;
            --overlay: #313244;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --blue: #89b4fa;
            --green: #a6e3a1;
            --red: #f38ba8;
            --yellow: #f9e2af;
            --border: #313244;
            --gutter: #585b70;
            --font: 'Victor Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .app {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            min-width: 120px;
            max-width: 50vw;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .sidebar-resize {
            position: absolute;
            top: 0;
            right: -4px;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
        }

        .sidebar-resize:hover,
        .sidebar-resize.active {
            background: var(--blue);
            opacity: 0.4;
        }

        .sidebar-header {
            padding: 12px 14px 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--subtext);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-new {
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 2px;
            border-radius: 3px;
        }

        .btn-new:hover {
            color: var(--text);
            background: var(--overlay);
        }

        .search-input {
            width: 100%;
            background: var(--overlay);
            border: none;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 14px;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--gutter);
        }

        .search-input:focus {
            background: var(--surface);
        }

        .search-results {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            max-width: 90%;
            max-height: 70vh;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 210;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .search-results .search-results-header {
            padding: 0;
            gap: 0;
            border-bottom: 1px solid var(--border);
        }

        .search-results .search-results-header .search-input {
            border: none;
            border-radius: 8px 0 0 0;
            padding: 10px 14px;
            background: var(--overlay);
        }

        .search-results .search-results-header .search-input:focus {
            background: var(--surface);
        }

        .search-results.visible {
            display: flex;
        }

        .search-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 209;
        }

        .search-backdrop.visible {
            display: block;
        }

        .search-results-header {
            display: flex;
            align-items: center;
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .search-results-header .search-input {
            flex: 1;
            border-bottom: 1px solid var(--border);
            border-radius: 4px;
        }

        .search-results-count {
            font-size: 11px;
            color: var(--gutter);
            white-space: nowrap;
            padding-left: 4px;
        }

        .search-results-list {
            overflow-y: auto;
            padding: 4px 0;
        }

        .search-results-list:empty {
            display: none;
        }

        .search-result-item {
            padding: 6px 14px;
            cursor: pointer;
            font-size: 13px;
            color: var(--subtext);
        }

        .search-result-item:hover,
        .search-result-item.selected {
            background: var(--overlay);
            color: var(--text);
        }

        .search-result-name {
            color: var(--blue);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .search-result-name mark {
            background: none;
            color: var(--green);
        }

        .search-result-snippet {
            font-size: 12px;
            color: var(--subtext);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-snippet mark {
            background: none;
            color: var(--yellow);
        }

        .search-no-results {
            padding: 16px 14px;
            font-size: 13px;
            color: var(--gutter);
        }

        .btn-search-close {
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 4px 10px;
            border-radius: 3px;
        }

        .btn-search-close:hover {
            color: var(--text);
            background: var(--overlay);
        }

        .note-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 4px;
        }

        .note-item {
            display: flex;
            align-items: center;
            padding: 6px 14px;
            margin: 2px 0;
            cursor: pointer;
            font-size: 14px;
            color: var(--subtext);
            position: relative;
        }

        .note-item:hover {
            background: var(--overlay);
            color: var(--text);
        }

        .note-item.active {
            background: var(--overlay);
            color: var(--text);
        }

        .note-item-input {
            flex: 1;
            background: none;
            border: none;
            color: inherit;
            font-family: var(--font);
            font-size: 14px;
            padding: 0;
            outline: none;
            min-width: 0;
            cursor: pointer;
        }

        .note-item-input.editing {
            cursor: text;
            background: var(--overlay);
            border-radius: 3px;
            padding: 0 4px;
            margin: 0 -4px;
        }

        .note-item .btn-delete {
            display: none;
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
            line-height: 1;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .note-item:hover .btn-delete {
            display: block;
        }

        .note-item .btn-delete:hover {
            color: var(--red);
        }

        /* Editor area */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-wrap {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .gutter {
            background: var(--surface);
            color: var(--gutter);
            padding: 10px 0;
            text-align: right;
            font-size: 14px;
            line-height: 1.5;
            font-family: var(--font);
            user-select: none;
            min-width: 48px;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }

        .gutter-line {
            padding: 0 12px 0 8px;
        }

        .editor {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.5;
            padding: 10px 16px;
            tab-size: 2;
            overflow: auto;
            white-space: pre;
        }

        .editor::placeholder {
            color: var(--gutter);
        }

        /* Status bar */
        .statusbar {
            height: 28px;
            background: var(--sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 14px;
            color: var(--subtext);
            gap: 16px;
        }

        .status-hint {
            color: var(--gutter);
            font-size: 12px;
        }

        .status-hint:hover {
            color: var(--subtext);
        }

        .status-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-share {
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .btn-share:hover {
            background: var(--overlay);
            color: var(--text);
        }

        .btn-share.copied {
            color: var(--green);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px 24px;
            min-width: 280px;
            max-width: 400px;
        }

        .modal-text {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--subtext);
            font-family: var(--font);
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-btn:hover {
            background: var(--overlay);
            color: var(--text);
        }

        .modal-btn-danger {
            border-color: var(--red);
            color: var(--red);
        }

        .modal-btn-danger:hover {
            background: var(--red);
            color: var(--sidebar);
        }

        /* Drop overlay */
        .drop-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(137, 180, 250, 0.08);
            z-index: 200;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .drop-overlay.visible {
            display: flex;
        }

        .drop-label {
            padding: 16px 32px;
            border: 2px dashed var(--blue);
            border-radius: 12px;
            color: var(--blue);
            font-family: var(--font);
            font-size: 16px;
            background: var(--sidebar);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--overlay);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gutter);
        }

        /* Mobile files button (hidden on desktop) */
        .btn-files {
            display: none;
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-family: var(--font);
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .btn-files:hover {
            background: var(--overlay);
            color: var(--text);
        }

        /* Responsive */
        .sidebar-close {
            display: none;
            background: none;
            border: none;
            color: var(--subtext);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0 2px;
            border-radius: 3px;
        }

        .sidebar-close:hover {
            color: var(--text);
            background: var(--overlay);
        }

        @media (max-width: 600px) {
            .sidebar {
                display: none;
            }

            .sidebar.open {
                display: flex;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 28px;
                width: 100%;
                min-width: 0;
                z-index: 50;
                border-right: none;
            }

            .sidebar-resize {
                display: none;
            }

            .sidebar-close {
                display: block;
            }

            .btn-files {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-resize" id="sidebarResize"></div>
            <div class="sidebar-header">
                <span>notes</span>
                <span style="margin-left:auto;display:flex;gap:8px">
                    <button class="btn-new" onclick="createNote(undefined, undefined, true)" title="New note">+</button>
                    <button class="sidebar-close" onclick="toggleSidebar()" title="Close">&times;</button>
                </span>
            </div>
            <div class="note-list" id="noteList"></div>
        </div>
        <div class="editor-container">
            <div class="editor-wrap">
                <div class="gutter" id="gutter"></div>
                <textarea class="editor" id="editor" placeholder="Start typing..." spellcheck="false"></textarea>
            </div>
            <div class="statusbar">
                <button class="btn-files" id="btnFiles" onclick="toggleSidebar()">files</button>
                <span class="status-hint" onclick="createNote()" style="cursor:pointer">ctrl+n new</span>
                <span class="status-hint" onclick="openSearch()" style="cursor:pointer">ctrl+p search</span>
                <div class="status-right">
                    <span id="charCount">0 chars</span>
                    <button class="btn-share" id="btnShare" onclick="shareNote()">share</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-text" id="modalText"></div>
            <div class="modal-actions">
                <button class="modal-btn" id="modalCancel">cancel</button>
                <button class="modal-btn modal-btn-danger" id="modalConfirm">delete</button>
            </div>
        </div>
    </div>

    <div class="search-backdrop" id="searchBackdrop"></div>
    <div class="search-results" id="searchResults">
        <div class="search-results-header">
            <input class="search-input" id="searchInput" type="text" placeholder="search..." spellcheck="false">
            <span class="search-results-count" id="searchCount"></span>
            <button class="btn-search-close" onclick="closeSearch()" title="Close">&times;</button>
        </div>
        <div class="search-results-list" id="searchResultsList"></div>
    </div>

    <div class="drop-overlay" id="dropOverlay">
        <div class="drop-label">drop files to import</div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const gutter = document.getElementById('gutter');
        const noteList = document.getElementById('noteList');
        const charCount = document.getElementById('charCount');
        const btnShare = document.getElementById('btnShare');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalText = document.getElementById('modalText');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');
        const sidebar = document.querySelector('.sidebar');

        const STORAGE_KEY = 'notepad_data';
        let state = { notes: [], activeId: null };
        let saveTimeout = null;
        let urlTimeout = null;
        const histories = {}; // per-note undo/redo: { noteId: { past: [], future: [] } }
        let historyTimeout = null;

        // --- Storage ---

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) state = JSON.parse(raw);
            } catch {}
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function getActiveNote() {
            return state.notes.find(n => n.id === state.activeId) || null;
        }

        // --- URL sync ---

        async function updateUrl() {
            const note = getActiveNote();
            if (!note) {
                history.replaceState(null, '', location.pathname);
                return;
            }
            try {
                const compressed = await compress(note.content);
                const params = new URLSearchParams();
                params.set('note', compressed);
                params.set('name', note.name);
                history.replaceState(null, '', location.pathname + '?' + params.toString());
            } catch {}
        }

        function scheduleUrlUpdate() {
            clearTimeout(urlTimeout);
            urlTimeout = setTimeout(updateUrl, 500);
        }

        // --- Undo/Redo history (per note, in memory) ---

        function getHistory(id) {
            if (!histories[id]) histories[id] = { past: [], future: [] };
            return histories[id];
        }

        function pushHistory(id, content) {
            const h = getHistory(id);
            const last = h.past.length ? h.past[h.past.length - 1] : null;
            if (content === last) return;
            h.past.push(content);
            if (h.past.length > 200) h.past.shift();
            h.future = [];
        }

        function scheduleHistorySnapshot() {
            clearTimeout(historyTimeout);
            const note = getActiveNote();
            if (!note) return;
            const id = note.id;
            const content = editor.value;
            historyTimeout = setTimeout(() => pushHistory(id, content), 400);
        }

        function undo() {
            const note = getActiveNote();
            if (!note) return;
            const h = getHistory(note.id);
            if (!h.past.length) return;
            h.future.push(note.content);
            note.content = h.past.pop();
            editor.value = note.content;
            note.updatedAt = Date.now();
            saveState();
            updateLineNumbers();
            updateCharCount();
            scheduleUrlUpdate();
        }

        function redo() {
            const note = getActiveNote();
            if (!note) return;
            const h = getHistory(note.id);
            if (!h.future.length) return;
            h.past.push(note.content);
            note.content = h.future.pop();
            editor.value = note.content;
            note.updatedAt = Date.now();
            saveState();
            updateLineNumbers();
            updateCharCount();
            scheduleUrlUpdate();
        }

        // --- Notes CRUD ---

        function nextNoteName() {
            let num = 1;
            while (state.notes.some(n => n.name === `note${num}.md`)) num++;
            return `note${num}.md`;
        }

        function createNote(name, content, focusName) {
            const note = {
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name: name || nextNoteName(),
                content: content || '',
                updatedAt: Date.now()
            };
            state.notes.unshift(note);
            state.activeId = note.id;
            saveState();
            render();
            if (focusName) {
                const input = noteList.querySelector('.note-item.active .note-item-input');
                if (input) {
                    input.readOnly = false;
                    input.focus();
                    const dot = input.value.lastIndexOf('.');
                    if (dot > 0) {
                        input.setSelectionRange(0, dot);
                    } else {
                        input.select();
                    }
                }
            } else {
                editor.focus();
            }
            return note;
        }

        async function confirmDelete(id) {
            const note = state.notes.find(n => n.id === id);
            if (!note) return;
            const confirmed = await showModal(`Delete "${note.name}"?`, 'delete', 'cancel', true);
            if (!confirmed) return;
            const idx = state.notes.findIndex(n => n.id === id);
            if (idx === -1) return;
            state.notes.splice(idx, 1);
            if (state.activeId === id) {
                state.activeId = state.notes.length ? state.notes[0].id : null;
            }
            saveState();
            render();
            updateUrl();
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            if (!sidebar.classList.contains('open')) editor.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                e.preventDefault();
                sidebar.classList.remove('open');
                editor.focus();
            }
        });

        function switchNote(id) {
            state.activeId = id;
            saveState();
            render();
            updateUrl();
            sidebar.classList.remove('open');
        }

        // --- Rendering ---

        function render() {
            renderNoteList();
            renderEditor();
            updateLineNumbers();
            updateCharCount();
        }

        function sortNotes() {
            state.notes.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
        }

        function renderNoteList() {
            noteList.innerHTML = '';
            sortNotes();
            for (const note of state.notes) {
                const div = document.createElement('div');
                div.className = 'note-item' + (note.id === state.activeId ? ' active' : '');

                const input = document.createElement('input');
                input.className = 'note-item-input';
                input.value = note.name;
                input.spellcheck = false;
                input.readOnly = true;
                input.addEventListener('click', (e) => {
                    if (state.activeId !== note.id) {
                        e.preventDefault();
                        switchNote(note.id);
                    } else if (input.readOnly) {
                        e.preventDefault();
                        input.readOnly = false;
                        input.classList.add('editing');
                        input.focus();
                        setTimeout(() => {
                            const dot = input.value.lastIndexOf('.');
                            if (dot > 0) {
                                input.setSelectionRange(0, dot);
                            } else {
                                input.select();
                            }
                        }, 0);
                    }
                });
                input.addEventListener('input', () => {
                    note.name = input.value.trim() || 'untitled';
                    note.updatedAt = Date.now();
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(saveState, 300);
                    scheduleUrlUpdate();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        input.blur();
                        editor.focus();
                    }
                });
                input.addEventListener('blur', () => {
                    input.readOnly = true;
                    input.classList.remove('editing');
                });

                const btn = document.createElement('button');
                btn.className = 'btn-delete';
                btn.title = 'Delete';
                btn.innerHTML = '&times;';
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    confirmDelete(note.id);
                });

                div.appendChild(input);
                div.appendChild(btn);
                noteList.appendChild(div);
            }
        }

        function renderEditor() {
            const note = getActiveNote();
            if (note) {
                editor.value = note.content;
                editor.disabled = false;
                btnShare.disabled = false;
            } else {
                editor.value = '';
                editor.disabled = true;
                btnShare.disabled = true;
            }
        }

        function updateLineNumbers() {
            const lines = (editor.value || '').split('\n').length;
            let html = '';
            for (let i = 1; i <= Math.max(lines, 1); i++) {
                html += `<div class="gutter-line">${i}</div>`;
            }
            gutter.innerHTML = html;
        }

        function updateCharCount() {
            const len = (editor.value || '').length;
            charCount.textContent = len + ' char' + (len !== 1 ? 's' : '');
        }

        // --- Auto-save ---

        editor.addEventListener('input', () => {
            const note = getActiveNote();
            if (!note) return;
            // Snapshot previous content for undo before updating
            const h = getHistory(note.id);
            if (!h.past.length || h.past[h.past.length - 1] !== note.content) {
                // Only push if we don't have a pending debounced snapshot
                if (!historyTimeout) pushHistory(note.id, note.content);
            }
            note.content = editor.value;
            note.updatedAt = Date.now();
            updateLineNumbers();
            updateCharCount();
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveState, 300);
            scheduleHistorySnapshot();
            scheduleUrlUpdate();
        });

        editor.addEventListener('scroll', () => {
            gutter.scrollTop = editor.scrollTop;
        });

        // --- Tab support ---

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 2;
                editor.dispatchEvent(new Event('input'));
            }
        });

        // --- Keyboard shortcuts ---

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            }
            if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'z') {
                e.preventDefault();
                redo();
            }
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault(); // prevent browser save dialog
            }
            if (e.ctrlKey && !e.metaKey && !e.shiftKey && e.key === 'n') {
                e.preventDefault();
                createNote();
            }
        });

        // --- Sharing via URL ---

        async function compress(text) {
            const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw'));
            const buf = await new Response(stream).arrayBuffer();
            const bytes = new Uint8Array(buf);
            let binary = '';
            for (const b of bytes) binary += String.fromCharCode(b);
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function decompress(b64) {
            const binary = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return await new Response(stream).text();
        }

        async function shareNote() {
            const note = getActiveNote();
            if (!note) return;
            try {
                const compressed = await compress(note.content);
                const params = new URLSearchParams();
                params.set('note', compressed);
                params.set('name', note.name);
                const url = location.origin + location.pathname + '?' + params.toString();
                await navigator.clipboard.writeText(url);
                btnShare.textContent = 'copied!';
                btnShare.classList.add('copied');
                setTimeout(() => {
                    btnShare.textContent = 'share';
                    btnShare.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Share failed:', err);
            }
        }

        function showModal(text, confirmLabel, cancelLabel, danger) {
            return new Promise((resolve) => {
                modalText.textContent = text;
                modalConfirm.textContent = confirmLabel;
                modalCancel.textContent = cancelLabel || '';
                modalCancel.style.display = cancelLabel ? '' : 'none';
                modalConfirm.className = danger ? 'modal-btn modal-btn-danger' : 'modal-btn';
                modalOverlay.classList.add('visible');

                function cleanup() {
                    modalOverlay.classList.remove('visible');
                    modalConfirm.removeEventListener('click', onConfirm);
                    modalCancel.removeEventListener('click', onCancel);
                    modalOverlay.removeEventListener('click', onOverlay);
                    document.removeEventListener('keydown', onKey);
                }
                function onConfirm() { cleanup(); resolve(true); }
                function onCancel() { cleanup(); resolve(false); }
                function onOverlay(e) { if (e.target === modalOverlay) { cleanup(); resolve(false); } }
                function onKey(e) {
                    if (e.key === 'Enter') { e.preventDefault(); onConfirm(); }
                    if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
                }

                modalConfirm.addEventListener('click', onConfirm);
                modalCancel.addEventListener('click', onCancel);
                modalOverlay.addEventListener('click', onOverlay);
                document.addEventListener('keydown', onKey);
            });
        }

        async function loadFromUrl() {
            const params = new URLSearchParams(location.search);
            const noteData = params.get('note');
            const name = params.get('name') || 'shared note';
            if (!noteData) return false;
            try {
                const content = await decompress(noteData);
                const existing = state.notes.find(n => n.name === name);
                if (existing) {
                    if (existing.content === content) {
                        // Identical — just open it
                        state.activeId = existing.id;
                        saveState();
                        return true;
                    }
                    // Content differs — ask user
                    render();
                    const update = await showModal(
                        `"${name}" already exists with different content.`,
                        'update',
                        'new file'
                    );
                    if (update) {
                        existing.content = content;
                        existing.updatedAt = Date.now();
                        state.activeId = existing.id;
                        saveState();
                    } else {
                        createNote(undefined, content);
                    }
                } else {
                    createNote(name, content);
                }
                return true;
            } catch (err) {
                console.error('Failed to load shared note:', err);
                return false;
            }
        }

        // --- Search ---

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const searchResultsList = document.getElementById('searchResultsList');
        const searchCount = document.getElementById('searchCount');
        const searchBackdrop = document.getElementById('searchBackdrop');
        let searchDebounce = null;

        function openSearch() {
            searchResults.classList.add('visible');
            searchBackdrop.classList.add('visible');
            searchInput.value = '';
            searchCount.textContent = '';
            searchResultsList.innerHTML = '';
            searchInput.focus();
        }

        searchBackdrop.addEventListener('click', () => {
            closeSearch();
            searchInput.value = '';
        });

        const MAX_LINES_PER_NOTE = 500;
        const MAX_MATCHES_PER_NOTE = 3;
        const MAX_RESULTS = 20;
        let searchSelectedIdx = -1;

        function fuzzyMatch(text, query) {
            const lower = text.toLowerCase();
            const q = query.toLowerCase();
            let qi = 0;
            const indices = [];
            for (let i = 0; i < lower.length && qi < q.length; i++) {
                if (lower[i] === q[qi]) {
                    indices.push(i);
                    qi++;
                }
            }
            if (qi < q.length) return null;
            let score = 0;
            for (let i = 0; i < indices.length; i++) {
                if (i > 0 && indices[i] === indices[i - 1] + 1) score += 2;
                score += 1;
                if (indices[i] < 10) score += 1;
            }
            return { indices, score };
        }

        function exactMatch(text, query) {
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return null;
            const indices = [];
            for (let i = idx; i < idx + query.length; i++) indices.push(i);
            // Exact matches score higher than fuzzy
            const score = query.length * 3 + (idx < 10 ? 5 : 0);
            return { indices, score };
        }

        function matchLine(text, query) {
            return exactMatch(text, query) || fuzzyMatch(text, query);
        }

        function searchNotes(query) {
            if (!query.trim()) {
                searchCount.textContent = '';
                searchResultsList.innerHTML = '';
                searchSelectedIdx = -1;
                return;
            }
            const results = [];
            for (const note of state.notes) {
                const nameMatch = matchLine(note.name, query);
                // Search content lines (capped)
                const lines = note.content.split('\n');
                const lineLimit = Math.min(lines.length, MAX_LINES_PER_NOTE);
                const lineMatches = [];
                for (let i = 0; i < lineLimit; i++) {
                    const m = matchLine(lines[i], query);
                    if (m) {
                        // Compute char offset for this line
                        let offset = 0;
                        for (let j = 0; j < i; j++) offset += lines[j].length + 1;
                        lineMatches.push({
                            line: lines[i],
                            lineNum: i + 1,
                            lineIndices: m.indices,
                            score: m.score,
                            charOffset: offset + m.indices[0]
                        });
                    }
                }
                // Sort line matches by score, keep top N
                lineMatches.sort((a, b) => b.score - a.score);
                const topLines = lineMatches.slice(0, MAX_MATCHES_PER_NOTE);

                const bestLineScore = topLines.length ? topLines[0].score : 0;
                // Filename matches weighted 4x
                const nameScore = nameMatch ? nameMatch.score * 4 : 0;
                const totalScore = nameScore + bestLineScore;
                // Active note gets a boost
                const activeBoost = note.id === state.activeId ? 1000 : 0;

                if (totalScore > 0) {
                    results.push({
                        note,
                        score: totalScore + activeBoost,
                        nameMatch,
                        lines: topLines
                    });
                }

                // Early termination: if we have enough high-quality results, stop
                if (results.length >= MAX_RESULTS * 2) break;
            }
            results.sort((a, b) => b.score - a.score);
            results.length = Math.min(results.length, MAX_RESULTS);
            showSearchResults(results, query);
        }

        function highlightFuzzy(text, indices) {
            if (!indices || !indices.length) return escapeHtml(text);
            let result = '';
            let last = 0;
            let groups = [];
            let start = indices[0], end = indices[0];
            for (let i = 1; i < indices.length; i++) {
                if (indices[i] === end + 1) {
                    end = indices[i];
                } else {
                    groups.push([start, end]);
                    start = end = indices[i];
                }
            }
            groups.push([start, end]);
            for (const [s, e] of groups) {
                result += escapeHtml(text.slice(last, s));
                result += '<mark>' + escapeHtml(text.slice(s, e + 1)) + '</mark>';
                last = e + 1;
            }
            result += escapeHtml(text.slice(last));
            return result;
        }

        function showSearchResults(results, query) {
            searchResults.classList.add('visible');
            searchBackdrop.classList.add('visible');
            searchCount.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '');
            searchResultsList.innerHTML = '';
            searchSelectedIdx = -1;
            if (results.length === 0) {
                searchResultsList.innerHTML = '<div class="search-no-results">no matches</div>';
                return;
            }
            for (let ri = 0; ri < results.length; ri++) {
                const r = results[ri];
                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.dataset.idx = ri;
                const nameDiv = document.createElement('div');
                nameDiv.className = 'search-result-name';
                if (r.nameMatch) {
                    nameDiv.innerHTML = highlightFuzzy(r.note.name, r.nameMatch.indices);
                } else {
                    nameDiv.textContent = r.note.name;
                }
                div.appendChild(nameDiv);
                // Show up to 3 matching lines
                const linesToShow = r.lines.length ? r.lines : [];
                for (const lm of linesToShow) {
                    const snippetDiv = document.createElement('div');
                    snippetDiv.className = 'search-result-snippet';
                    const prefix = lm.lineNum + ': ';
                    const trimmed = lm.line.length > 120 ? lm.line.slice(0, 120) : lm.line;
                    snippetDiv.innerHTML = '<span style="color:var(--gutter)">' + escapeHtml(prefix) + '</span>' + highlightFuzzy(trimmed, lm.lineIndices);
                    div.appendChild(snippetDiv);
                }
                // Use first line match for jump target, or just switch to note
                const target = linesToShow[0] || null;
                div.addEventListener('click', () => {
                    switchNote(r.note.id);
                    closeSearch();
                    searchInput.value = '';
                    editor.focus();
                    if (target && target.charOffset > 0) {
                        editor.setSelectionRange(target.charOffset, target.charOffset);
                        const textBefore = editor.value.substring(0, target.charOffset);
                        const lineNum = textBefore.split('\n').length;
                        const lineHeight = parseFloat(getComputedStyle(editor).lineHeight);
                        editor.scrollTop = Math.max(0, (lineNum - 3) * lineHeight);
                    }
                });
                searchResultsList.appendChild(div);
            }
            // Auto-select first result
            searchSelectedIdx = 0;
            updateSearchSelection();
        }

        function updateSearchSelection() {
            const items = searchResultsList.querySelectorAll('.search-result-item');
            items.forEach((el, i) => {
                el.classList.toggle('selected', i === searchSelectedIdx);
            });
            // Scroll selected into view
            if (items[searchSelectedIdx]) {
                items[searchSelectedIdx].scrollIntoView({ block: 'nearest' });
            }
        }

        function closeSearch() {
            searchResults.classList.remove('visible');
            searchBackdrop.classList.remove('visible');
            searchSelectedIdx = -1;
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => searchNotes(searchInput.value), 150);
        });

        searchInput.addEventListener('keydown', (e) => {
            const items = searchResultsList.querySelectorAll('.search-result-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length) {
                    searchSelectedIdx = (searchSelectedIdx + 1) % items.length;
                    updateSearchSelection();
                }
                return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length) {
                    searchSelectedIdx = (searchSelectedIdx - 1 + items.length) % items.length;
                    updateSearchSelection();
                }
                return;
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                closeSearch();
                searchInput.value = '';
                searchInput.blur();
                editor.focus();
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                const selected = items[searchSelectedIdx] || items[0];
                if (selected) selected.click();
            }
        });

        // Cmd/Ctrl+P or Cmd/Ctrl+F opens search, Escape closes it
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && (e.key === 'p' || e.key === 'f')) {
                e.preventDefault();
                openSearch();
                searchInput.select();
            }
            if (e.key === 'Escape' && searchResults.classList.contains('visible')) {
                e.preventDefault();
                e.stopPropagation();
                closeSearch();
                searchInput.value = '';
                editor.focus();
            }
        });

        // --- Utilities ---

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // --- Drag & drop files ---

        const dropOverlay = document.getElementById('dropOverlay');
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) dropOverlay.classList.add('visible');
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('dragleave', (e) => {
            dragCounter--;
            if (dragCounter <= 0) {
                dragCounter = 0;
                dropOverlay.classList.remove('visible');
            }
        });

        document.addEventListener('drop', (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropOverlay.classList.remove('visible');
            const files = e.dataTransfer.files;
            if (!files.length) return;
            const unsupported = [];
            for (const file of files) {
                if (!file.type.startsWith('text/') && !isTextFilename(file.name)) {
                    unsupported.push(file.name);
                    continue;
                }
                const reader = new FileReader();
                reader.onload = async () => {
                    const existing = state.notes.find(n => n.name === file.name);
                    if (existing) {
                        const update = await showModal(
                            `"${file.name}" already exists.`,
                            'update',
                            'new file'
                        );
                        if (update) {
                            existing.content = reader.result;
                            existing.updatedAt = Date.now();
                            state.activeId = existing.id;
                            saveState();
                            render();
                        } else {
                            const dot = file.name.lastIndexOf('.');
                            let base = dot > 0 ? file.name.slice(0, dot) : file.name;
                            let ext = dot > 0 ? file.name.slice(dot) : '';
                            let num = 1;
                            while (state.notes.some(n => n.name === `${base}${num}${ext}`)) num++;
                            createNote(`${base}${num}${ext}`, reader.result);
                        }
                    } else {
                        createNote(file.name, reader.result);
                    }
                };
                reader.readAsText(file);
            }
            if (unsupported.length) {
                showModal(
                    'Unsupported file' + (unsupported.length > 1 ? 's' : '') + ': ' + unsupported.join(', ') + '. Only text files are supported.',
                    'ok', null
                );
            }
        });

        function isTextFilename(name) {
            const textExts = ['.txt','.md','.markdown','.json','.jsonl','.json5','.js','.jsx','.ts','.tsx','.mjs','.cjs','.mts','.cts','.css','.scss','.sass','.less','.html','.htm','.xml','.xsl','.xslt','.csv','.tsv','.yaml','.yml','.toml','.ini','.cfg','.conf','.sh','.bash','.zsh','.fish','.ps1','.bat','.cmd','.py','.pyi','.pyw','.rb','.rake','.gemspec','.go','.rs','.java','.scala','.kt','.kts','.groovy','.gradle','.c','.h','.cpp','.hpp','.cc','.cxx','.hxx','.cs','.fs','.fsx','.swift','.m','.mm','.r','.R','.jl','.lua','.pl','.pm','.php','.phtml','.ex','.exs','.erl','.hrl','.hs','.lhs','.clj','.cljs','.cljc','.edn','.lisp','.cl','.el','.rkt','.ml','.mli','.v','.sv','.vhd','.vhdl','.sql','.graphql','.gql','.proto','.thrift','.avsc','.tf','.hcl','.nix','.dhall','.dart','.zig','.nim','.cr','.d','.pas','.pp','.asm','.s','.wasm','.wat','.sol','.vy','.move','.cairo','.log','.env','.env.local','.env.example','.properties','.lock','.sum','.mod','.cmake','.make','.mk','.dockerfile','.containerfile','.vagrantfile','.rakefile','.gemfile','.podfile','.gitignore','.gitattributes','.gitmodules','.dockerignore','.npmignore','.eslintignore','.prettierignore','.editorconfig','.prettierrc','.eslintrc','.babelrc','.browserslistrc','.stylelintrc','.huskyrc','.lintstagedrc','.nvmrc','.node-version','.ruby-version','.python-version','.tool-versions','.svg','.plist','.strings','.resx','.pot','.po','.rst','.adoc','.asciidoc','.tex','.bib','.sty','.cls','.org','.wiki','.textile','.diff','.patch'];
            const lower = name.toLowerCase();
            return textExts.some(ext => lower.endsWith(ext));
        }

        // --- Sidebar resize ---

        const sidebarResize = document.getElementById('sidebarResize');
        const SIDEBAR_WIDTH_KEY = 'notepad_sidebar_width';

        (function restoreSidebarWidth() {
            const saved = localStorage.getItem(SIDEBAR_WIDTH_KEY);
            if (saved) sidebar.style.width = saved + 'px';
        })();

        sidebarResize.addEventListener('mousedown', (e) => {
            e.preventDefault();
            sidebarResize.classList.add('active');
            const onMove = (e) => {
                const w = Math.min(Math.max(e.clientX, 120), window.innerWidth * 0.5);
                sidebar.style.width = w + 'px';
            };
            const onUp = () => {
                sidebarResize.classList.remove('active');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                localStorage.setItem(SIDEBAR_WIDTH_KEY, parseInt(sidebar.style.width));
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        // --- Cross-tab sync ---

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
                try {
                    const newState = JSON.parse(e.newValue);
                    const currentContent = editor.value;
                    const activeNote = getActiveNote();
                    state.notes = newState.notes;
                    // Keep current tab's active note if it still exists
                    if (activeNote && state.notes.find(n => n.id === activeNote.id)) {
                        state.activeId = activeNote.id;
                    } else {
                        state.activeId = newState.activeId;
                    }
                    render();
                    // Restore cursor position if active note content didn't change
                    const note = getActiveNote();
                    if (note && note.id === activeNote?.id && note.content === currentContent) {
                        editor.value = currentContent;
                    }
                } catch {}
            }
            if (e.key === SIDEBAR_WIDTH_KEY && e.newValue) {
                sidebar.style.width = e.newValue + 'px';
            }
        });

        // --- Init ---

        async function init() {
            loadState();
            const loaded = await loadFromUrl();
            if (!loaded && state.notes.length === 0) {
                createNote('welcome.md', 'Welcome to note.\n\nStart typing to create a note.\nYour notes are saved locally.\nThe URL updates automatically — copy it to share.');
            }
            render();
            updateUrl();
        }

        init();
    </script>
</body>
</html>
