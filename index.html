<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jaggli.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            padding-top: 30vh;
            justify-content: center;
            background: #0a0a1a;
            background-image:
                linear-gradient(to bottom, #0a0a1a 0%, #1a0a2e 40%, #2d1b4e 70%, #1a0a2e 100%);
            overflow: hidden;
            position: relative;
        }

        /* Stars */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-image:
                radial-gradient(1px 1px at 10% 10%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 55% 8%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 85% 12%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 95% 35%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 15% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 35% 5%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 60% 40%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 75% 5%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1px 1px at 5% 25%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 48% 20%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 30% 2%, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 80% 18%, rgba(255,255,255,0.6), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* Grid floor */
        .grid {
            position: fixed;
            bottom: 0;
            left: -50%;
            width: 200%;
            height: 45%;
            background:
                linear-gradient(to right, rgba(255, 0, 200, 0.15) 1px, transparent 1px),
                linear-gradient(to top, rgba(255, 0, 200, 0.15) 1px, transparent 1px);
            background-size: 80px 40px;
            transform: perspective(400px) rotateX(55deg);
            transform-origin: center top;
            z-index: 0;
        }

        /* Horizon glow */
        .horizon {
            position: fixed;
            bottom: 32%;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, transparent, #ff00c8, #00fff2, #ff00c8, transparent);
            box-shadow: 0 0 40px 10px rgba(255, 0, 200, 0.4);
            z-index: 1;
        }

        /* Sun */
        .sun {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 50vw);
            height: min(150px, 25vw);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            background: linear-gradient(to top, #ff4500, #ff0080, #ff6ec7);
            box-shadow: 0 0 60px 20px rgba(255, 0, 128, 0.3);
            overflow: hidden;
            z-index: 0;
        }

        /* Sun stripes */
        .sun::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to top,
                transparent 0px,
                transparent 8px,
                #0a0a1a 8px,
                #0a0a1a 12px
            );
        }

        /* Neon text */
        .neon {
            position: relative;
            z-index: 2;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            font-size: clamp(2.5rem, 10vw, 8rem);
            text-align: center;
            color: #fff;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #fff,
                0 0 42px #ff00c8,
                0 0 82px #ff00c8,
                0 0 92px #ff00c8,
                0 0 102px #ff00c8,
                0 0 151px #ff00c8;
            animation: flicker 3s infinite alternate;
            padding: 0 1rem;
            line-height: 1.2;
        }

        .neon .dot {
            color: #00fff2;
            text-shadow:
                0 0 7px #00fff2,
                0 0 10px #00fff2,
                0 0 21px #00fff2,
                0 0 42px #00b4d8,
                0 0 82px #00b4d8,
                0 0 92px #00b4d8,
                0 0 102px #00b4d8,
                0 0 151px #00b4d8;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                    0 0 7px #fff,
                    0 0 10px #fff,
                    0 0 21px #fff,
                    0 0 42px #ff00c8,
                    0 0 82px #ff00c8,
                    0 0 92px #ff00c8,
                    0 0 102px #ff00c8,
                    0 0 151px #ff00c8;
            }
            20%, 24%, 55% {
                text-shadow:
                    0 0 4px #fff,
                    0 0 7px #fff,
                    0 0 12px #fff,
                    0 0 22px #ff00c8,
                    0 0 42px #ff00c8;
            }
        }
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="horizon"></div>
    <div class="grid"></div>
    <h1 class="neon">jaggli<span class="dot">.</span>com</h1>
    <script src="bubble-wrap.js"></script>
</body>
</html>
